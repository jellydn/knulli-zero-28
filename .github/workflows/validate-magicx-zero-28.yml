name: Validate MagicX Zero 28 port

# Lightweight board-port validation that runs on GitHub-hosted runners.
# The full 180 GiB image build still requires the self-hosted x64 runner
# (see build-magicx-zero-28.yml); this workflow catches port regressions
# that would otherwise only surface after a multi-hour build.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'board/allwinner/a133/magicx-zero-28/**'
      - 'package/boot/uboot-a133/magicx-zero-28/**'
  push:
    paths:
      - 'board/allwinner/a133/magicx-zero-28/**'
      - 'package/boot/uboot-a133/magicx-zero-28/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install device-tree compiler and u-boot tools
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler u-boot-tools

      - name: Validate Zero 28 board port
        run: |
          set -uo pipefail
          B=board/allwinner/a133/magicx-zero-28
          BP=package/boot/uboot-a133/magicx-zero-28/boot_package
          errors=0

          # 1) DTS compiles with 0 errors (vendor DTS emits cosmetic warnings)
          dtc -I dts -O dtb -o /tmp/zero28.dtb "$BP/magicx-zero-28.dts" 2>/tmp/dtc.err
          e=$(grep -c 'Error' /tmp/dtc.err 2>/dev/null || true)
          echo "DTS errors: $e"
          errors=$((errors + e))

          # 2) shell scripts + boot.cmd parse
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; errors=$((errors+1)); }
          done < <(find "$B" \( -name '*.sh' -o -name 'boot.cmd' \) -type f)

          # 3) partition images + boot files exist
          for img in boot0.img boot.img env.img boot_package.fex; do
            [ -f "$B/partitions/$img" ] || { echo "MISSING partitions/$img"; errors=$((errors+1)); }
          done
          for f in uImage uInitrd bootlogo.bmp knulli-boot.conf; do
            [ -f "$B/$f" ] || { echo "MISSING $f"; errors=$((errors+1)); }
          done
          for f in u-boot.bin monitor.bin scp.bin; do
            [ -f "$BP/$f" ] || { echo "MISSING boot_package/$f"; errors=$((errors+1)); }
          done

          # 4) genimage.cfg references resolve to existing partitions
          #    (zero-28 uses the ../partitions/ convention like xu20-v32)
          while IFS= read -r img; do
            case "$img" in
              boot.vfat|userdata.ext4|*.fex) : ;;
              *)
                base=$(basename "$img")
                [ -f "$B/partitions/$base" ] || { echo "genimage refs missing: $img"; errors=$((errors+1)); }
                ;;
            esac
          done < <(sed -n 's/^[[:space:]]*image[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$B/genimage.cfg")

          # 5) Boot contract integrity (the A133 boards boot via Android-style
          #    boot.img = zImage + ramdisk.gz + baked cmdline). Guard the
          #    magic numbers and the device identity.
          ZIMAGE=package/boot/uboot-a133/magicx-zero-28/boot/boot.img-zImage
          RAMDISK=package/boot/uboot-a133/magicx-zero-28/boot/boot.img-ramdisk.gz
          CMDLINE=package/boot/uboot-a133/magicx-zero-28/boot/boot.img-cmdline

          # zImage must be an arm64 kernel Image (magic "ARMd" at offset 0x38)
          MAGIC=$(dd if="$ZIMAGE" bs=1 skip=56 count=4 2>/dev/null)
          [ "$MAGIC" = "ARMd" ] || { echo "boot.img-zImage is not arm64 Image (magic=$MAGIC)"; errors=$((errors+1)); }
          # ramdisk must be gzip
          GMAGIC=$(head -c 2 "$RAMDISK" 2>/dev/null)
          [ "$GMAGIC" = $'\x1f\x8b' ] || { echo "boot.img-ramdisk.gz is not gzip"; errors=$((errors+1)); }
          # cmdline must target the A133 root partition (mmcblk0p4, like xu20-v32)
          grep -q 'root=/dev/mmcblk0p4' "$CMDLINE" || { echo "boot.img-cmdline missing root=/dev/mmcblk0p4"; errors=$((errors+1)); }

          # 6) Device identity guard — the panel must remain the Zero 28 640x480
          #    h028b23 (NOT the Zero 40 RTP40WV101B 480x800 touch panel).
          DTS=package/boot/uboot-a133/magicx-zero-28/boot_package/magicx-zero-28.dts
          grep -q 'h028b23' "$DTS" || { echo "panel identity lost (h028b23)"; errors=$((errors+1)); }
          grep -q 'RTP40WV101B' "$DTS" && { echo "WRONG panel: Zero 40 RTP40WV101B leaked into Zero 28"; errors=$((errors+1)); }
          grep -q 'cap_touch' "$DTS" && { echo "WRONG: touch panel node present in non-touch Zero 28"; errors=$((errors+1)); }

          # 7) Flash-layout parity: the Zero 28 partition offsets/sizes must match
          #    the known-working xu20-v32 A133 reference. A drift here bricks devices.
          #    Normalize the board-specific boot_package.fex filename before diffing.
          Z28=board/allwinner/a133/magicx-zero-28/genimage.cfg
          REF=board/allwinner/a133/xu20-v32/genimage.cfg
          norm() { sed -n '/image knulli.img/,/^}/p' "$1" | sed -E 's/[a-z0-9-]+_boot_package\.fex/BOARD_boot_package.fex/'; }
          if ! diff <(norm "$Z28") <(norm "$REF") >/tmp/layout.diff 2>&1; then
            echo "genimage layout drifted from xu20-v32 reference:"; cat /tmp/layout.diff
            errors=$((errors+1))
          fi

          # 8) Boot-package integrity: the committed partitions/boot_package.fex
          #    must byte-contain the committed u-boot/monitor/scp blobs and the DTB
          #    built from the committed DTS. This proves the shipped boot package
          #    is internally consistent with the source (a silent drift would
          #    otherwise go undetected until a device fails to boot).
          python3 package/boot/uboot-a133/extract_boot_package.py "$B/partitions/boot_package.fex" >/dev/null 2>&1
          for f in u-boot.bin monitor.bin scp.bin; do
            cmp -s "output_blocks/$f" "$BP/$f" || { echo "boot_package.fex $f drifted from committed source"; errors=$((errors+1)); }
          done
          dtc -I dts -O dtb -o /tmp/fresh.dtb "$BP/magicx-zero-28.dts" 2>/dev/null
          cmp -s /tmp/fresh.dtb output_blocks/dtb.bin || { echo "boot_package.fex dtb drifted from committed DTS"; errors=$((errors+1)); }

          echo "total_errors=$errors"
          [ "$errors" -eq 0 ]
